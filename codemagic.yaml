workflows:
  latchi-play-android-apk:
    name: LATCHI PLAY Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: 16.20.2
      java: 17
      vars:
        APP_NAME: "LATCHI PLAY"
        PACKAGE_NAME: "com.latchi.play"

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $CM_BUILD_DIR/node_modules

    scripts:
      - name: Show project structure
        script: |
          pwd
          ls -la
          echo "--- android structure ---"
          ls -la android
          echo "--- app structure ---"
          ls -la android/app

      - name: Show build environment
        script: |
          node --version
          npm --version
          java -version

      - name: Clean local machine files
        script: |
          rm -f android/local.properties
          rm -rf .idea
          rm -rf android/.gradle
          rm -rf android/app/build

      - name: Install JavaScript dependencies
        script: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify Gradle wrapper
        script: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew not found"
            exit 1
          fi
          chmod +x android/gradlew
          echo "Gradle wrapper is ready"

      - name: Build Release APK with retry
        script: |
          cd android
          attempt=1
          max=3
          while true; do
            echo "===== Release build attempt $attempt ====="
            set -o pipefail
            ./gradlew --no-daemon clean :app:assembleRelease --stacktrace 2>&1 | tee "$CM_BUILD_DIR/build_release_log.txt"
            status=$?
            set +o pipefail
            if [ "$status" -eq 0 ]; then
              echo "Release build succeeded"
              break
            fi
            if grep -qiE "Read timed out|Could not (GET|download)|connection reset|Network is unreachable|Could not resolve|Received fatal alert|handshake_failure" "$CM_BUILD_DIR/build_release_log.txt" \
               && ! grep -qiE "compileReleaseKotlin FAILED|compileReleaseJavaWithJavac FAILED|Compilation error|^e: " "$CM_BUILD_DIR/build_release_log.txt" \
               && [ "$attempt" -lt "$max" ]; then
              echo "Network issue detected. Retrying in 20s..."
              attempt=$((attempt+1))
              sleep 20
              continue
            fi
            echo "Build failed due to a real error. See build_release_log.txt"
            exit 1
          done

      - name: Verify and collect APK
        script: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No release APK produced."
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cp "$APK" "$CM_BUILD_DIR/artifacts/latchi-play-release.apk"
          ls -la "$CM_BUILD_DIR/artifacts"

    artifacts:
      - artifacts/*.apk
      - android/app/build/outputs/apk/release/*.apk
      - build_release_log.txt
      - android/app/build/reports/**/*

